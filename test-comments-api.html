<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Comments API</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-2xl font-bold mb-6">Test Comments API</h1>
        
        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <h2 class="text-lg font-semibold mb-4">API Test Results</h2>
            <button onclick="testCommentsAPI()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
                Test Comments API
            </button>
            <div id="results" class="mt-4"></div>
        </div>
        
        <div class="bg-white rounded-lg shadow p-6">
            <h2 class="text-lg font-semibold mb-4">Comments Data</h2>
            <div id="commentsData"></div>
        </div>
    </div>

    <script>
        async function testCommentsAPI() {
            const resultsDiv = document.getElementById('results');
            const commentsDiv = document.getElementById('commentsData');
            
            resultsDiv.innerHTML = '<div class="text-blue-600">Testing...</div>';
            
            try {
                const response = await fetch('api/get_comments.php');
                const result = await response.json();
                
                if (result.success) {
                    resultsDiv.innerHTML = `
                        <div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded">
                            <strong>SUCCESS!</strong> Found ${result.data.length} comments
                        </div>
                    `;
                    
                    // Display comments
                    if (result.data.length > 0) {
                        commentsDiv.innerHTML = `
                            <div class="overflow-x-auto">
                                <table class="min-w-full divide-y divide-gray-200">
                                    <thead class="bg-gray-50">
                                        <tr>
                                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">ID</th>
                                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Nama</th>
                                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Email</th>
                                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Komentar</th>
                                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Status</th>
                                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Berita</th>
                                        </tr>
                                    </thead>
                                    <tbody class="bg-white divide-y divide-gray-200">
                                        ${result.data.map(comment => `
                                            <tr>
                                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${comment.id_komentar}</td>
                                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${comment.nama_pengunjung}</td>
                                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${comment.email || '-'}</td>
                                                <td class="px-6 py-4 text-sm text-gray-900 max-w-xs truncate">${comment.isi_komentar}</td>
                                                <td class="px-6 py-4 whitespace-nowrap">
                                                    <span class="px-2 py-1 text-xs font-medium rounded-full ${getStatusClass(comment.status)}">
                                                        ${comment.status.toUpperCase()}
                                                    </span>
                                                </td>
                                                <td class="px-6 py-4 text-sm text-gray-500 max-w-xs truncate">${comment.judul_berita || 'No title'}</td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        `;
                    } else {
                        commentsDiv.innerHTML = '<div class="text-gray-500">No comments found</div>';
                    }
                } else {
                    resultsDiv.innerHTML = `
                        <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">
                            <strong>ERROR!</strong> ${result.message}
                        </div>
                    `;
                    commentsDiv.innerHTML = '';
                }
            } catch (error) {
                resultsDiv.innerHTML = `
                    <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">
                        <strong>FETCH ERROR!</strong> ${error.message}
                    </div>
                `;
                commentsDiv.innerHTML = '';
            }
        }
        
        function getStatusClass(status) {
            switch(status) {
                case 'approved': return 'bg-green-100 text-green-800';
                case 'pending': return 'bg-yellow-100 text-yellow-800';
                case 'rejected': return 'bg-red-100 text-red-800';
                default: return 'bg-gray-100 text-gray-800';
            }
        }
        
        // Auto test on load
        document.addEventListener('DOMContentLoaded', () => {
            testCommentsAPI();
        });
    </script>
</body>
</html>
