<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Test Simple API</title>
    <style>
        body { font-family: Arial; max-width: 800px; margin: 20px auto; padding: 20px; }
        button { background: #3b82f6; color: white; border: none; padding: 15px 30px; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #2563eb; }
        .result { margin-top: 20px; padding: 15px; border-radius: 4px; }
        .success { background: #d1fae5; border: 1px solid #10b981; }
        .error { background: #fee2e2; border: 1px solid #ef4444; }
        pre { background: #f9fafb; padding: 10px; border-radius: 4px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🧪 Test Simple API</h1>
    <button onclick="testAPI()">Test Add News (Simple API)</button>
    <div id="result"></div>

    <script>
        async function testAPI() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<strong>Loading...</strong>';
            resultDiv.className = 'result';
            
            const newsData = {
                judul: 'Test Simple API',
                isi_berita: 'Konten test dari simple API',
                id_kategori: 1,
                status: 'draft',
                gambar: '',
                id_penulis: 1
            };
            
            console.log('Sending:', newsData);
            
            try {
                const response = await fetch('api/manage_news_simple.php?action=add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newsData)
                });
                
                console.log('Status:', response.status);
                
                const text = await response.text();
                console.log('Response:', text);
                
                const result = JSON.parse(text);
                
                if (result.success) {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `
                        <strong>✅ Success!</strong><br>
                        ${result.message}<br><br>
                        <pre>${JSON.stringify(result.data, null, 2)}</pre>
                    `;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `
                        <strong>❌ Error!</strong><br>
                        ${result.message}<br><br>
                        <pre>${JSON.stringify(result, null, 2)}</pre>
                    `;
                }
            } catch (error) {
                console.error('Error:', error);
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `<strong>❌ Exception!</strong><br>${error.message}`;
            }
        }
    </script>
</body>
</html>
