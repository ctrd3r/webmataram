<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test News API</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-6xl mx-auto">
        <h1 class="text-2xl font-bold mb-6">Test News API</h1>
        
        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <h2 class="text-lg font-semibold mb-4">API Test Results</h2>
            <button onclick="testNewsAPI()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 mr-2">
                Test News API
            </button>
            <button onclick="testNewsStats()" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">
                Test News Stats
            </button>
            <div id="results" class="mt-4"></div>
        </div>
        
        <div class="bg-white rounded-lg shadow p-6">
            <h2 class="text-lg font-semibold mb-4">News Data</h2>
            <div id="newsData"></div>
        </div>
    </div>

    <script>
        async function testNewsAPI() {
            const resultsDiv = document.getElementById('results');
            const newsDiv = document.getElementById('newsData');
            
            resultsDiv.innerHTML = '<div class="text-blue-600">Testing News API...</div>';
            
            try {
                const response = await fetch('api/get_news.php?limit=10');
                const result = await response.json();
                
                console.log('News API Response:', result);
                
                if (result.success) {
                    resultsDiv.innerHTML = `
                        <div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded">
                            <strong>SUCCESS!</strong> Found ${result.data.length} news items
                        </div>
                    `;
                    
                    // Display news
                    if (result.data.length > 0) {
                        newsDiv.innerHTML = `
                            <div class="overflow-x-auto">
                                <table class="min-w-full divide-y divide-gray-200">
                                    <thead class="bg-gray-50">
                                        <tr>
                                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">ID</th>
                                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Judul</th>
                                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Kategori</th>
                                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Penulis</th>
                                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Views</th>
                                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Featured</th>
                                        </tr>
                                    </thead>
                                    <tbody class="bg-white divide-y divide-gray-200">
                                        ${result.data.map(news => `
                                            <tr>
                                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${news.id_berita}</td>
                                                <td class="px-6 py-4 text-sm text-gray-900 max-w-xs truncate">${news.judul}</td>
                                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${news.kategori}</td>
                                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${news.penulis}</td>
                                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${news.views}</td>
                                                <td class="px-6 py-4 whitespace-nowrap">
                                                    <span class="px-2 py-1 text-xs font-medium rounded-full ${news.featured ? 'bg-red-100 text-red-800' : 'bg-gray-100 text-gray-800'}">
                                                        ${news.featured ? 'UTAMA' : 'BIASA'}
                                                    </span>
                                                </td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        `;
                    } else {
                        newsDiv.innerHTML = '<div class="text-gray-500">No news found</div>';
                    }
                } else {
                    resultsDiv.innerHTML = `
                        <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">
                            <strong>ERROR!</strong> ${result.message}
                        </div>
                    `;
                    newsDiv.innerHTML = '';
                }
            } catch (error) {
                resultsDiv.innerHTML = `
                    <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">
                        <strong>FETCH ERROR!</strong> ${error.message}
                    </div>
                `;
                newsDiv.innerHTML = '';
            }
        }
        
        async function testNewsStats() {
            const resultsDiv = document.getElementById('results');
            
            resultsDiv.innerHTML = '<div class="text-blue-600">Testing News Stats API...</div>';
            
            try {
                const response = await fetch('api/manage_news.php?action=stats');
                const result = await response.json();
                
                console.log('News Stats Response:', result);
                
                if (result.success) {
                    resultsDiv.innerHTML = `
                        <div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded">
                            <strong>NEWS STATS SUCCESS!</strong><br>
                            Total News: ${result.data.total_news}<br>
                            Total Views: ${result.data.total_views}<br>
                            Published: ${result.data.published_news}<br>
                            Draft: ${result.data.draft_news}
                        </div>
                    `;
                } else {
                    resultsDiv.innerHTML = `
                        <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">
                            <strong>STATS ERROR!</strong> ${result.message}
                        </div>
                    `;
                }
            } catch (error) {
                resultsDiv.innerHTML = `
                    <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">
                        <strong>STATS FETCH ERROR!</strong> ${error.message}
                    </div>
                `;
            }
        }
        
        // Auto test on load
        document.addEventListener('DOMContentLoaded', () => {
            testNewsAPI();
        });
    </script>
</body>
</html>
