<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Featured News API</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Test Featured News API</h1>
        
        <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
            <h2 class="text-xl font-bold mb-4">API Response</h2>
            <pre id="api-response" class="bg-slate-100 p-4 rounded overflow-auto max-h-96 text-sm">Loading...</pre>
        </div>
        
        <div class="bg-white rounded-lg shadow-lg p-6">
            <h2 class="text-xl font-bold mb-4">Rendered News</h2>
            <div id="featured-news-container" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                Loading...
            </div>
        </div>
    </div>

    <script>
        async function testAPI() {
            try {
                console.log('Fetching news from API...');
                const response = await fetch('/api/get_news.php?limit=10&sort=newest');
                const data = await response.json();
                
                console.log('API Response:', data);
                document.getElementById('api-response').textContent = JSON.stringify(data, null, 2);
                
                if (data.success && data.data && data.data.length > 0) {
                    // Show first 2 items
                    const news = data.data.slice(0, 2);
                    const html = news.map(item => `
                        <div class="border rounded-lg overflow-hidden">
                            <img src="${item.gambar_url || item.gambar_utama || '/images/placeholder-news.jpg'}" 
                                 alt="${item.judul}" 
                                 class="w-full h-48 object-cover"
                                 onerror="this.src='/images/placeholder-news.jpg'">
                            <div class="p-4">
                                <h3 class="font-bold text-lg mb-2">${item.judul}</h3>
                                <p class="text-sm text-slate-600 mb-2">${item.ringkasan || 'No description'}</p>
                                <p class="text-xs text-slate-500">${item.kategori || 'Umum'} - ${item.tanggal_publish}</p>
                            </div>
                        </div>
                    `).join('');
                    
                    document.getElementById('featured-news-container').innerHTML = html;
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('api-response').textContent = 'Error: ' + error.message;
            }
        }
        
        testAPI();
    </script>
</body>
</html>
